{% if user.is_authenticated %}
<form id="like-{{ post.id }}" method="post" action="{% url 'feed:like_post' post_id=post.id %}"
      hx-post="{% url 'feed:like_post' post_id=post.id %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit" class="flex items-center gap-1.5 hover:scale-105 transition-transform"
            aria-pressed="{{ post.is_liked|yesno:'true,false' }}" aria-label="{{ post.is_liked|yesno:'Unlike,Like' }}">
        {% if post.is_liked %}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-red-500" viewBox="0 0 24 24" fill="currentColor"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" /></svg>
        {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
        {% endif %}
        <span class="text-sm font-semibold">{{ post.like_total }} like{{ post.like_total|pluralize }}</span>
    </button>
</form>
{% else %}
<a href="{% url 'accounts:login' %}?next={{ request.path|urlencode }}" class="flex items-center gap-1.5" aria-label="Log in to like">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
    <span class="text-sm font-semibold">{{ post.like_total }} like{{ post.like_total|pluralize }}</span>
</a>
{% endif %}
