{% load media_tags %}
<div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Post as:</label>
    <div class="flex gap-3 overflow-x-auto pb-2">
        {% for pet in user_pets %}
        <label class="flex-shrink-0 cursor-pointer">
            <input type="radio" name="pet_id" value="{{ pet.id }}" class="sr-only peer" {% if forloop.first %}checked{% endif %}>
            <div class="flex flex-col items-center p-3 rounded-xl border-2 border-gray-200 peer-checked:border-brand peer-checked:bg-orange-50 transition-colors">
                {% if pet.picture %}
                <img src="{{ pet.picture|resized:128 }}" alt="{{ pet.name }}" class="w-16 h-16 rounded-full object-cover">
                {% else %}
                <div class="w-16 h-16 rounded-full bg-brand flex items-center justify-center text-white font-bold text-xl">{{ pet.name|slice:":1" }}</div>
                {% endif %}
                <span class="mt-2 text-sm font-medium">{{ pet.name }}</span>
            </div>
        </label>
        {% endfor %}
    </div>
</div>
