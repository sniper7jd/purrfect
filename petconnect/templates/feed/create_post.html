{% extends 'base.html' %}

{% block title %}Create Post - PetConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold mb-6">Create New Post</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Select Pet -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Post as:</label>
                <div class="flex gap-3 overflow-x-auto pb-2">
                    {% for pet in user_pets %}
                    <label class="flex-shrink-0 cursor-pointer">
                        <input type="radio" name="pet_id" value="{{ pet.id }}" class="hidden peer" {% if forloop.first %}checked{% endif %}>
                        <div class="flex flex-col items-center p-3 rounded-xl border-2 border-gray-200 peer-checked:border-brand peer-checked:bg-orange-50 transition-colors">
                            {% if pet.picture %}
                            <img src="{{ pet.picture.url }}" alt="{{ pet.name }}" class="w-16 h-16 rounded-full object-cover">
                            {% else %}
                            <div class="w-16 h-16 rounded-full bg-brand flex items-center justify-center text-white font-bold text-xl">
                                {{ pet.name|slice:":1" }}
                            </div>
                            {% endif %}
                            <span class="mt-2 text-sm font-medium">{{ pet.name }}</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>
            
            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Photo</label>
                <div id="image-preview" class="hidden mb-4">
                    <img src="" alt="Preview" class="w-full aspect-square object-cover rounded-xl">
                </div>
                <label for="post-image-input" class="block w-full p-8 border-2 border-dashed border-gray-300 rounded-xl text-center cursor-pointer hover:border-brand transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span class="mt-2 block text-sm text-gray-600">Click to upload a photo</span>
                </label>
                {{ form.image }}
            </div>
            
            <!-- Caption -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Caption</label>
                {{ form.caption }}
            </div>
            
            <button type="submit" class="w-full bg-brand text-white py-3 rounded-xl font-semibold hover:bg-brand-dark transition-colors">
                Share
            </button>
        </form>
    </div>
</div>

<script>
const imageInput = document.getElementById('post-image-input');
const previewContainer = document.getElementById('image-preview');
const previewImg = previewContainer.querySelector('img');

imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            previewImg.src = e.target.result;
            previewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }
});
</script>
{% endblock %}
