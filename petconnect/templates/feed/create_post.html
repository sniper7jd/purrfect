{% extends 'base.html' %}
{% load media_tags %}

{% block title %}Create Post - PetConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold mb-6">Create New Post</h1>

        {% if form.errors %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm">{{ form.errors }}</div>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="space-y-6" x-data="imagePreview">
            {% csrf_token %}
            {% include "feed/_pet_picker.html" %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Photo</label>
                <img x-show="preview" x-cloak :src="preview" alt="Preview" class="w-full aspect-square object-cover rounded-xl mb-4">
                <label for="post-image-input" class="block w-full p-8 border-2 border-dashed border-gray-300 rounded-xl text-center cursor-pointer hover:border-brand transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    <span class="mt-2 block text-sm text-gray-600" x-text="preview ? 'Choose a different photo' : 'Click to upload a photo'">Click to upload a photo</span>
                </label>
                <input type="file" name="image" accept="image/*" id="post-image-input" class="sr-only" required @change="pick">
            </div>

            <div>
                <label for="{{ form.caption.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">Caption</label>
                {{ form.caption }}
            </div>

            <button type="submit" class="w-full bg-brand text-white py-3 rounded-xl font-semibold hover:bg-brand-dark transition-colors">Share</button>
        </form>
    </div>
</div>
{% endblock %}
