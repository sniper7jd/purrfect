{% extends 'base.html' %}

{% block title %}Add Story - PetConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold mb-1">Add to Your Story</h1>
        <p class="text-gray-500 mb-6 text-sm">Stories disappear after 24 hours.</p>

        <form method="post" enctype="multipart/form-data" class="space-y-6" x-data="imagePreview">
            {% csrf_token %}
            {% include "feed/_pet_picker.html" %}

            <div>
                <img x-show="preview" x-cloak :src="preview" alt="Preview" class="w-full aspect-[9/16] max-h-[60vh] object-cover rounded-xl mb-4">
                <label for="story-image-input" class="block w-full p-8 border-2 border-dashed border-gray-300 rounded-xl text-center cursor-pointer hover:border-brand transition-colors">
                    <span class="block text-sm text-gray-600" x-text="preview ? 'Choose a different photo' : 'Click to upload a photo'">Click to upload a photo</span>
                </label>
                <input type="file" name="image" accept="image/*" id="story-image-input" class="sr-only" required @change="pick">
            </div>

            <button type="submit" class="w-full bg-brand text-white py-3 rounded-xl font-semibold hover:bg-brand-dark transition-colors">Share Story</button>
        </form>
    </div>
</div>
{% endblock %}
