{% extends 'base.html' %}

{% block title %}Offline - PetConnect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="text-6xl mb-4">🐾</div>
    <h1 class="text-2xl font-bold mb-2">You're offline</h1>
    <p class="text-gray-500 mb-6">PetConnect needs a connection to load new posts and messages. We'll be right here when you're back.</p>
    <button type="button" onclick="location.reload()" class="bg-brand text-white px-6 py-3 rounded-lg hover:bg-brand-dark transition-colors">Try again</button>
</div>
{% endblock %}
