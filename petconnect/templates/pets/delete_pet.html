{% extends 'base.html' %}

{% block title %}Delete {{ pet.name }} - PetConnect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="text-5xl mb-4">😿</div>
        <h1 class="text-2xl font-bold mb-2">Delete {{ pet.name }}?</h1>
        <p class="text-gray-500 mb-8">This permanently removes {{ pet.name }}'s profile, posts, stories, followers, and reviews.</p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <a href="{% url 'pets:edit' pet_id=pet.id %}" class="px-6 py-3 rounded-xl border border-gray-300 font-semibold hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-6 py-3 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-700">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
