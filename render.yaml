# Fallback host. Primary deployment is Koyeb (see README). Render's free Postgres expires
# after 30 days, so the database lives on Neon and uploads on Cloudinary either way.
services:
  - type: web
    name: petconnect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
