databases:
  - name: petconnect-db
    databaseName: petconnect
    user: petconnect
    plan: free

services:
  - type: web
    name: petconnect
    runtime: python
    plan: free
    rootDir: petconnect
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT petconnect.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: PLACES_API_KEY
        sync: false
