# Render Blueprint: New > Blueprint > select this repo.
# The database (Neon) and uploads (Cloudinary) live outside Render, so they persist
# across deploys and never expire.
services:
  - type: web
    name: petconnect
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
